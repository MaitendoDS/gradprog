<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Inschrijven Student - Hogeschool Gent</h1>
    </header>
    
    <form action="#" method="post">
        <label for="naam">Naam:</label>
        <input type="text" id="naam" name="naam" required>
    
        <label for="opleiding">Opleiding:</label>
        <select id="opleiding" name="opleiding" required>
            <!-- Opties voor beschikbare opleidingen -->
            <option value="informatica">Informatica</option>
            <option value="elektrotechniek">Elektrotechniek</option>
            <!-- Voeg hier meer opleidingen toe -->
        </select>
    
        <!-- Voeg hier meer inputvelden toe voor andere benodigde informatie -->
    
        <button type="submit">Inschrijven</button>
    </form>
    
    <footer>
        <p>&copy; 2023 Schooladministratie - Hogeschool Gent</p>
    </footer>
    
</body>
</html>
