<!DOCTYPE html> 
<html> 
<head> 
	<title>Oefening</title> 
	<link rel="stylesheet" type="text/css" href="styles/index.css">
	<script type="text/javascript" charset="utf-8" src="scripts/index.js"></script> 
</head> 

<body>
<form>
	<table>
		<tr>
			<td>
				<label for="checkbox">Is roker:</label>
				<input type="checkbox" id="checkbox" name="checkbox">
			</td>
		</tr>
		<tr>
			<td>
				<label>Moedertaal:</label>
			</td>
			<td>
				<label>
					<input type="radio" name="moedertaal" value="nederlands" checked>
					Nederlands
				</label>
			</td>
			<td>
				<label>
					<input type="radio" name="moedertaal" value="frans">
					Frans
				</label>
			</td>
			<td>
				<label>
					<input type="radio" name="moedertaal" value="engels">
					Engels
				</label>
			</td>
		</tr>
		<tr>
			<td colspan="2">
				<label for="buurland">Favoriete buurland:</label>
				<select id="buurland" name="buurland">
					<option value="frankrijk">Frankrijk</option>
					<option value="nederland">Nederland</option>
					<option value="duitsland">Duitsland</option>
					<option value="luxemburg">Luxemburg</option>
				</select>
			</td>
		</tr>
		<tr>
			<td>
				<label for="bestelling">Bestelling:</label>

				<select id="bestelling" name="bestelling" size="6" multiple>
					<option value="aardappelen">Aardappelen</option>
					<option value="brood">Brood</option>
					<option value="melk">Melk</option>
					<option value="biefstuk">Biefstuk</option>
					<option value="chips">Chips</option>
					<option value="krant">Krant</option>
				</select>

			</td>
		</tr>
	</table>
	<button id="btn"  type="button">Toon resultaat</button>
</form>
</body> 
</html>
